name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BACKEND_URL: https://ai-image-studio-delta.vercel.app

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release --dart-define=BACKEND_URL=${{ env.BACKEND_URL }}

      - run: cp build/app/outputs/flutter-apk/app-release.apk AI_Image_Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI_Image_Studio-apk
          path: flutter_app/AI_Image_Studio.apk

      - name: Publish to Releases (public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AI Image Studio (latest build)
          body: "Download AI_Image_Studio.apk below and install it on Android."
          files: flutter_app/AI_Image_Studio.apk
          make_latest: true
